[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autograder"
version = "0.1.0"
description = "Автопроверка учебных заданий: публичный репозиторий курса + приватный репозиторий с тестами + Google-форма сдачи"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "numpy>=1.24",
    "pytest>=7",
    "nbformat>=5",
    "nbclient>=0.9",
    "ipykernel>=6",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]

[project.scripts]
grader = "autograder.cli:main"

[tool.setuptools.packages.find]
include = ["autograder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
